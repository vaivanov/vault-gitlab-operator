replicaCount: 1 # keep 1: two reconcilers would race on the same targets

image:
  repository: ghcr.io/vaivanov/vault-gitlab-operator
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The GitLab API token is injected as the GITLAB_TOKEN env var.
# Reference an existing Secret (recommended) ...
gitlabToken:
  existingSecret: ""
  key: gitlab-token
  # ... or let the chart create one from this value (avoid in production;
  # anyone with access to the release values can read it).
  value: ""

# The operator configuration, rendered verbatim into a ConfigMap as
# config.yaml. See https://github.com/vaivanov/vault-gitlab-operator for
# the full reference. gitlab.token_env must stay GITLAB_TOKEN — that is
# the env var the chart wires the token into.
config:
  vault:
    address: https://vault.example.com:8200
    auth:
      method: kubernetes
      kubernetes:
        role: vault-gitlab-operator
  gitlab:
    url: https://gitlab.example.com
    token_env: GITLAB_TOKEN
  sync:
    interval: 5m
    jitter: 30s
  defaults:
    vault_mount: kv
  # Replace with your real targets — the operator refuses to start
  # without at least one.
  targets:
    projects: []

logLevel: info
logFormat: json

listenPort: 8080

# Extra env vars (e.g. VGO_VAULT_ROLE_ID for approle auth).
extraEnv: []
# Extra volumes/mounts (e.g. a Vault secret-id file or a custom CA).
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
