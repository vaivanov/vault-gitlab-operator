version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - errorlint
    - usetesting
    - ineffassign
    - unused
  settings:
    gosec:
      excludes:
        - G404 # math/rand is fine for sync jitter
        - G304 # config/token file paths come from the operator's own config by design
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
