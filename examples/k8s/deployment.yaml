apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-gitlab-operator
  namespace: vault-gitlab-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-gitlab-operator-config
  namespace: vault-gitlab-operator
data:
  config.yaml: |
    vault:
      address: https://vault.internal:8200
      auth:
        method: kubernetes
        kubernetes:
          role: vault-gitlab-operator
    gitlab:
      url: https://gitlab.internal
      token_env: GITLAB_TOKEN
    sync:
      interval: 5m
      jitter: 30s
    defaults:
      vault_mount: kv
    targets:
      projects:
        - project: platform/backend
          variables:
            - key: DB_PASSWORD
              vault: { path: ci/backend/db, field: password }
              masked: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-gitlab-operator
  namespace: vault-gitlab-operator
spec:
  replicas: 1
  strategy:
    type: Recreate          # never two reconcilers at once
  selector:
    matchLabels:
      app: vault-gitlab-operator
  template:
    metadata:
      labels:
        app: vault-gitlab-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: vault-gitlab-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: registry.gitlab.internal/infra/vault-gitlab-operator:latest
          args: ["daemon", "--config", "/etc/vgo/config.yaml", "--log-format", "json"]
          env:
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-gitlab-operator
                  key: gitlab-token
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/vgo
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vault-gitlab-operator-config
---
# The GitLab token lives in a Secret created out-of-band (or, fittingly,
# provisioned by vault-secrets-operator):
#   kubectl -n vault-gitlab-operator create secret generic vault-gitlab-operator \
#     --from-literal=gitlab-token=glpat-...
