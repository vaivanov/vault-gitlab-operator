# Local playground: Vault in dev mode + the operator in daemon mode.
# Seed a secret, then watch the operator sync it:
#   docker compose up -d vault
#   docker compose exec vault vault kv put -mount=secret ci/app password=hunter22hunter22
#   docker compose up operator
services:
  vault:
    image: hashicorp/vault:1.20
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  operator:
    build: ..
    depends_on:
      - vault
    ports:
      - "8080:8080"
    environment:
      VAULT_TOKEN: dev-root-token
      GITLAB_TOKEN: ${GITLAB_TOKEN:?set GITLAB_TOKEN}
    volumes:
      - ./config.yaml:/etc/vgo/config.yaml:ro
    command: ["daemon", "--config", "/etc/vgo/config.yaml", "--log-format", "json"]
